{title:'The Strange Incident',scene:'The Candle Hall',icon:'🕯️',intro:'Tonight, the Dawn Prism vanished from its sealed cabinet. Without it, dawn will arrive without the school’s enchanted light. Tap the empty plinth, inspect the crests, then open the cabinet. Optional objects reward careful eyes.',hot:[['plinth',27,54,'🏛️','Empty plinth'],['dial',72,35,'☀️','Crest chart'],['clock',49,18,'🕰️','Hall clock'],['feather',82,75,'🪶','Loose feather']],puzzles:['crest'],summary:'The seal was not broken. Someone knew another way into the cabinet.'},

function fresh(){return{version:1,screen:'intro',name:'Hermoine',house:'Gryffindor',level:0,clues:[],items:[],solved:[],talk:{},hints:{},fail:{},wrong:0,accuse:0,score:0,settings:{sound:false,large:false,contrast:false,motion:matchMedia('(prefers-reduced-motion: reduce)').matches},finished:false};}

function save(){try{localStorage.setItem(KEY,JSON.stringify(state));saved=JSON.parse(JSON.stringify(state));}catch(e){storage=false;}const n=document.getElementById('storage');if(n)n.textContent=storage?'Progress saved automatically.':'Progress stays in memory; saving is unavailable in this browser.';}
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}

function add(parent,...children){children.forEach(c=>parent.append(c));return parent;}

function clue(id){if(state.clues.includes(id))return false;state.clues.push(id);state.score+=15;save();return true;}
function item(id){if(!state.items.includes(id)){state.items.push(id);save();}}

function game(){const L=LEVELS[state.level];const hud=el('header',undefined,'hud');add(hud,el('span',`${state.house} · ${Math.max(0,state.score)} points`,'badge'));const tools=el('nav',undefined,'row');[['Journal',journal],['Inventory',inventory],['Suspects',board],['Hint',hintMenu],['Menu',menu]].forEach(([t,f])=>tools.append(btn(t,f)));hud.append(tools);app.append(hud);const main=el('main',undefined,'shell reveal');add(main,el('div',`Chapter ${state.level+1} / 5`,'eyebrow'),el('h2',L.title));const prog=el('div',undefined,'progress'),bar=el('i');bar.style.width=((state.level+1)*20)+'%';prog.append(bar);main.append(prog);const lay=el('div',undefined,'layout');lay.style.marginTop='20px';const scene=el('section',undefined,'scene');scene.setAttribute('aria-label',L.scene+' interactive scene');scene.append(sceneArt(state.level));L.hot.forEach(([id,x,y,icon,label])=>{const b=btn('',()=>inspect(id), 'hot'+(state.clues.includes(id)?' found':''));add(b,el('span',icon,'icon'),el('span',label+(state.clues.includes(id)?' ✓':'')));b.style.left=x+'%';b.style.top=y+'%';b.setAttribute('aria-label','Inspect '+label);scene.append(b);});if(state.level===2&&state.solved.includes('tonic'))scene.append(hotExtra('Reveal root mark',55,52,'✨',useTrace));if(state.level===4&&state.solved.includes('seals'))scene.append(hotExtra('Open prism cradle',55,57,'💎',usePrism));scene.append(el('p',L.scene+' · Explore each object. Check marks show collected clues.','caption'));const side=el('section',undefined,'card');add(side,el('h3',L.scene),el('p',L.intro));const msg=el('div','Your journal keeps every clue. Optional objects may change your final rank.','message');msg.id='message';msg.setAttribute('role','status');side.append(msg);if(state.level===1)side.append(btn('Question the four suspects',board));L.puzzles.forEach(id=>side.append(btn((state.solved.includes(id)?'✓ ':'')+PUZZLES[id].title,()=>openPuzzle(id))));const ready=L.puzzles.every(id=>state.solved.includes(id))&&(state.level!==2||state.clues.includes('trace'))&&(state.level!==4||state.clues.includes('prism'));if(ready)side.append(btn(state.level===4?'Build your accusation':'Chapter complete →',()=>{if(state.level===4)accusation();else popup('Chapter complete',p=>add(p,el('p',L.summary),btn('Continue',()=>{state.level++;modal.close();save();render();},'gold')));},'gold'));add(side,el('p',`Clues found: ${state.clues.length} · Solved: ${state.solved.length}/6`,'status'));const st=el('p',storage?'Progress saved automatically.':'Progress stays in memory; saving is unavailable in this browser.','status');st.id='storage';side.append(st);add(lay,scene,side);add(main,lay);app.append(main);}

function board(){popup('Suspect board',p=>{const grid=el('div',undefined,'grid');SUSPECTS.forEach((s,i)=>{const c=el('article',undefined,'card');add(c,el('h3',s.icon+' '+s.name),el('p',s.role,'muted'),el('p',state.talk[i]?s.note:'Not interviewed yet.'));if(state.level>=1)c.append(btn('Talk to '+s.name,()=>interview(i)));grid.append(c);});p.append(grid);});}
let speechTimer=null;
function speak(node,text){clearInterval(speechTimer);if(state.settings.motion){node.textContent=text;return;}let n=0;node.textContent='';speechTimer=setInterval(()=>{if(!modal.open||!node.isConnected){clearInterval(speechTimer);return;}n+=3;node.textContent=text.slice(0,n);if(n>=text.length)clearInterval(speechTimer);},24);node.dataset.fullText=text;}
function interview(i){const s=SUSPECTS[i];popup(s.name,p=>{const speech=el('p','“Ask away. I will try to be more useful than an enchanted filing cabinet.”','message');p.append(speech);['Where were you?','What are you hiding?','Which keys do you carry?'].forEach((q,j)=>p.append(btn(q,()=>{state.talk[i]=state.talk[i]||[];if(!state.talk[i].includes(j))state.talk[i].push(j);save();speak(speech,s.answers[j]);})));p.append(btn('Show full dialogue',()=>{clearInterval(speechTimer);if(speech.dataset.fullText)speech.textContent=speech.dataset.fullText;}));p.append(btn('Back to suspect board',board));});}
// D. PUZZLE MODULES. Wrong answers never consume items or lock progression.
function openPuzzle(id){activePuzzle=id;puzzleInput=[];const P=PUZZLES[id];popup(P.title,p=>{if(state.solved.includes(id)){add(p,el('p','Already solved. Your discovery is recorded in the journal.'));return;}const missing=P.needs.filter(c=>!state.clues.includes(c));if(missing.length){add(p,el('p','Explore first: '+missing.map(c=>CLUES[c][0]).join(', ')+'.'));return;}if(id==='timeline'&&SUSPECTS.some((s,i)=>(state.talk[i]||[]).length<3)){p.append(el('p','Ask each suspect all three questions before comparing their bookings.'));p.append(btn('Open suspect board',board));return;}add(p,el('p',P.text));const feedback=el('p','','message');feedback.id='pfeedback';let submit;
if(P.type==='sequence')submit=sequencePuzzle(p,P);
if(P.type==='code')submit=codePuzzle(p,P);
if(P.type==='timeline')submit=timelinePuzzle(p);
if(P.type==='tonic')submit=tonicPuzzle(p,P);
if(P.type==='mechanism')submit=mechanismPuzzle(p);
add(p,feedback,btn('Check answer',()=>{if(submit())solve(id);else fail(id);},'gold'),btn('Hint · −5 points',()=>hint(id)));if((state.fail[id]||0)>=3)p.append(btn('Guided solve · −20 points',()=>{state.score-=20;solve(id);}));});}
function sequencePuzzle(p,P){const output=el('p','No seals selected.','note');p.append(output);const row=el('div',undefined,'runes');P.options.forEach((name,i)=>row.append(btn(name,()=>{if(puzzleInput.length<P.answer.length)puzzleInput.push(i);output.textContent=puzzleInput.map(n=>P.options[n]).join(' → ');})));add(p,row,btn('Clear sequence',()=>{puzzleInput=[];output.textContent='No seals selected.';}));return()=>JSON.stringify(puzzleInput)===JSON.stringify(P.answer);}
function codePuzzle(p,P){const input=el('input');input.placeholder='Decoded word';input.autocomplete='off';add(p,add(el('label','Your answer','label'),input));return()=>P.answer.includes(input.value.trim().toLowerCase());}
function timelinePuzzle(p){const values=[];['Mira Finch','Oren Moss','Tessa Quill'].forEach((s,i)=>{const select=el('select');['Choose booking…','Observatory · 8:00','Kitchen · 8:10','Theatre · 8:20'].forEach((v,j)=>{const o=el('option',v);o.value=j;select.append(o);});values.push(select);p.append(add(el('label',s,'label'),select));});return()=>values.every((v,i)=>Number(v.value)===i+1);}
function tonicPuzzle(p,P){let ingredient=null;const output=el('p','Cauldron empty.','note'),r=el('div',undefined,'row');['Moon-salt','Dew','Sun-petal','Soot'].forEach(v=>{const b=btn(v,()=>{ingredient=v;Array.from(r.children).forEach(c=>c.classList.remove('chosen'));b.classList.add('chosen');});b.draggable=true;b.ondragstart=e=>e.dataTransfer.setData('text/plain',v);r.append(b);});const pour=v=>{if(!['Moon-salt','Dew','Sun-petal','Soot'].includes(v))return;if(puzzleInput.length>=8){output.textContent='Cauldron full. Empty it to try again.';return;}puzzleInput.push(v);output.textContent=puzzleInput.join(' → ');};const cauldron=btn('🫕 Add selected ingredient',()=>{if(ingredient)pour(ingredient);else output.textContent='Select an ingredient first.';});cauldron.ondragover=e=>e.preventDefault();cauldron.ondrop=e=>{e.preventDefault();pour(e.dataTransfer.getData('text/plain'));};add(p,r,cauldron,output,btn('Empty cauldron',()=>{puzzleInput=[];output.textContent='Cauldron empty.';}));return()=>JSON.stringify(puzzleInput)===JSON.stringify(P.answer);}
function mechanismPuzzle(p){const fields=[];['Transfer time (h:mm)','Bell time (h:mm)','Delay (minutes)'].forEach(label=>{const input=el('input');fields.push(input);p.append(add(el('label',label,'label'),input));});const sel=el('select');['Choose mechanism…','Frozen clock → Root transfer → Echo spool','Root transfer → Echo spool → Frozen clock','Echo spool → Frozen clock → Root transfer'].forEach((t,i)=>{const o=el('option',t);o.value=i;sel.append(o);});p.append(add(el('label','Mechanism order','label'),sel));const norm=s=>s.trim().toLowerCase().replace(/\s*(pm|p\.m\.)$/,'').replace(/^0/,'');return()=>['8:10','20:10'].includes(norm(fields[0].value))&&['8:20','20:20'].includes(norm(fields[1].value))&&Number(fields[2].value.trim())===10&&sel.value==='2';}
function solve(id){if(state.solved.includes(id))return;state.solved.push(id);state.score+=80;if(id==='crest')item('key');if(id==='tonic')item('tonic');save();modal.close();render();message(id==='tonic'?'The tonic is ready. Select it in Inventory, then use it on the root mark.':id==='seals'?'The seals open. Use your cradle key on the prism cradle.':'Solved! Continue exploring, or advance when you are ready.');}
function fail(id){state.fail[id]=(state.fail[id]||0)+1;state.wrong++;state.score-=10;save();const f=document.getElementById('pfeedback');f.textContent='That does not fit yet. Your clues and items are safe. '+(state.fail[id]>=3?'A guided solve is now available.':'Compare the relevant journal entries.');if(state.fail[id]===3)modal.append(btn('Guided solve · −20 points',()=>{state.score-=20;solve(id);}));}
function hint(id){const n=state.hints[id]||0;if(n>=3){const f=document.getElementById('pfeedback');if(f)f.textContent=PUZZLES[id].hints[2];else message(PUZZLES[id].hints[2]);return;}state.hints[id]=n+1;state.score-=5;save();const f=document.getElementById('pfeedback');if(f)f.textContent=`Hint ${n+1}/3: `+PUZZLES[id].hints[n];else popup('Hint '+(n+1)+'/3',p=>p.append(el('p',PUZZLES[id].hints[n])));}
function hintMenu(){popup('Choose a puzzle hint',p=>LEVELS[state.level].puzzles.forEach(id=>p.append(btn(PUZZLES[id].title,()=>hint(id)))));}
function accusation(){popup('Your accusation',p=>{add(p,el('p','Choose a culprit, a motive and a method, then support your case with three evidence entries. You may revise an incorrect case.'));const who=el('select'),why=el('select'),how=el('select');['Choose culprit…',...SUSPECTS.map(s=>s.name)].forEach(x=>who.append(el('option',x)));['Choose motive…','Win the drama competition','Prevent the night garden’s sale','Hide stolen biscuits','Repair the telescope'].forEach(x=>why.append(el('option',x)));['Choose method…','Break the cabinet with a wand','Move prism through root conduit; delay bell with echo spool','Replace prism with a costume feather','Carry prism through the front door'].forEach(x=>how.append(el('option',x)));add(p,add(el('label','Culprit','label'),who),add(el('label','Motive','label'),why),add(el('label','Method','label'),how),el('h3','Supporting evidence'));const evidence=[];state.clues.forEach(id=>{const cb=el('input');cb.type='checkbox';cb.value=id;evidence.push(cb);const lab=el('label',undefined,'row');add(lab,cb,el('span',CLUES[id][0]));p.append(lab);});const feedback=el('p','','message');add(p,feedback,btn('Present case',()=>{const selected=evidence.filter(e=>e.checked).map(e=>e.value);const supported=[['gate','register','receipt'],['orders','margin','care','prism'],['trace','echo','manual']].every(group=>group.some(id=>selected.includes(id)));if(who.value==='Archivist Vale'&&why.selectedIndex===2&&how.selectedIndex===2&&supported&&selected.length>=3){state.score+=100;state.screen='ending';state.finished=true;save();modal.close();render();}else{state.accuse++;state.score-=15;save();feedback.textContent=who.value!=='Archivist Vale'?'The key access and time evidence do not support that culprit. Recheck the gate log.':why.selectedIndex!==2?'That motive does not explain the appeals or the garden note.':how.selectedIndex!==2?'The seal is intact. The transfer trace and delayed bell require another method.':'Support access, motive and mechanism with at least one clue for each.';if(state.accuse>=3)feedback.textContent+=' Guided path: compare the archive-key access, the sale appeals, and the transfer trace with the echo spool.';}},'gold'));});}
function ending(){const points=Math.max(0,state.score),rank=points>=850?'Master Detective':points>=650?'Skilled Investigator':'Apprentice Investigator';const p=el('main',undefined,'hero reveal');add(p,el('div','Mystery resolved','eyebrow'),el('h1','A dawn worth keeping.'),el('p','Vale admits moving the prism through the root conduit at 8:10, delaying the bell until 8:20 and freezing the clock with violet wax. One dark dawn would reveal the night flowers before the governors sold their garden.'),el('p',rank==='Master Detective'?'Your complete evidence convinces the governors to preserve the garden. Vale returns the prism and accepts a new rule: no secret demonstrations.':rank==='Skilled Investigator'?'The prism returns safely. Your evidence wins the garden a review; Vale agrees to explain the night flowers in daylight.':'The prism returns. The governors postpone the sale while the school gathers more evidence. Vale learns that asking for help beats moving the sun.'),el('h2',rank),el('p',`${state.name} · ${state.house} · ${points} points · ${state.clues.length}/${Object.keys(CLUES).length} clues`),el('p',`${state.wrong} puzzle errors · ${Object.values(state.hints).reduce((a,b)=>a+b,0)} hints · ${state.accuse} revised accusations`,'muted'));add(p,btn('Replay',()=>{state.screen='title';render();}),btn('Share result',()=>popup('Share your result',q=>{const text=el('textarea');text.rows=4;text.style.width='100%';text.value=`I solved The Borrowed Dawn as ${rank}: ${points} points and ${state.clues.length} clues. Can you save Bramblewick’s dawn?`;text.setAttribute('aria-label','Result text to copy');add(q,el('p','Select and copy this spoiler-free result.'),text);text.focus();text.select();})));app.append(p);}
// E. OPTIONAL AUDIO. No sound until explicit opt-in.
function tone(){if(!state.settings.sound)return;try{audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();audioContext.resume();const o=audioContext.createOscillator(),g=audioContext.createGain();o.type='sine';o.frequency.value=440;g.gain.setValueAtTime(.035,audioContext.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+.18);o.connect(g);g.connect(audioContext.destination);o.start();o.stop(audioContext.currentTime+.2);}catch(e){state.settings.sound=false;}}
// F. SETTINGS AND KEYBOARD ACCESS. Native dialog provides focus trapping and Escape.
function menu(){popup('Menu & settings',p=>{[['sound','Enable sound effects'],['large','Larger text'],['contrast','High contrast'],['motion','Reduce motion']].forEach(([key,label])=>{const cb=el('input');cb.type='checkbox';cb.checked=state.settings[key];cb.onchange=()=>{state.settings[key]=cb.checked;applySettings();save();if(key==='sound')tone();};add(p,add(el('label',undefined,'row'),cb,el('span',label)));});add(p,el('h3','Revisit a room'));LEVELS.forEach((L,i)=>{if(i<=Math.max(state.level,...state.solved.map(id=>LEVELS.findIndex(l=>l.puzzles.includes(id)))))p.append(btn(L.scene,()=>{state.level=i;modal.close();save();render();}));});p.append(btn('Title screen',()=>{modal.close();titleScreen();}));});}
function titleScreen(){state.screen='title';render();}
// G. START-UP: auto-resume valid checkpoints; no persistent storage needed to play.
if(saved&&saved.screen!=='title'){state=saved;render();}else{state.screen='title';render();}
</script></body></html>
